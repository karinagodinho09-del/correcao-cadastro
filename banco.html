<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Revisão do banco de cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script>try{ if(localStorage.getItem('tema')==='light') document.documentElement.removeAttribute('data-theme'); }catch(e){}</script>
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#17201D; --muted:#5B6863; --line:#D6DCD8; --soft:#E8ECE9; --mark:#FFE58A;
  --red:#B23A3A; --red-bg:rgba(178,58,58,.08); --green:#3F8A33; --green-bg:rgba(63,138,51,.09); --amber:#B9791E; --amber-bg:rgba(185,121,30,.12); --blue:#2A78A3; --blue-bg:rgba(42,120,163,.09);
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1d2522; --ink:#E9EEEB; --muted:#9AA6A1; --line:#33403b; --soft:#26302c; --mark:#7a6416;
  --red:#E06B6B; --red-bg:rgba(224,107,107,.12); --green:#6CBF5E; --green-bg:rgba(108,191,94,.12); --amber:#E0A54A; --amber-bg:rgba(224,165,74,.14); --blue:#5BA6D0; --blue-bg:rgba(91,166,208,.12);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1300px;margin:0 auto;padding-left:20px;padding-right:20px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
[hidden]{display:none!important}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}

header.top{padding-top:26px;padding-bottom:14px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 20px}
.top h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(2rem,4.5vw,3rem);line-height:1;margin:0 0 8px}
.top .grow{flex:1 1 420px}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0;color:var(--muted)}
.lv{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px;font-size:.95rem}
.lv i{font-style:normal;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;color:var(--ink)}
.lv.warn i{color:var(--amber)}
.src{display:flex;gap:8px;align-items:end;flex-wrap:wrap}
.f label{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 3px}
.field{width:100%;font:inherit;font-size:1rem;padding:9px 11px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.field:focus{outline:none;border-color:var(--ink)}
.btn{font:inherit;font-weight:600;font-size:.95rem;padding:9px 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.ok{background:var(--green-bg);border-color:var(--green);color:var(--green)}
.btn.ok:hover{background:var(--green);color:#fff}
.btn.del{background:var(--red-bg);border-color:var(--red);color:var(--red)}
.btn.del:hover{background:var(--red);color:#fff}
.btn.icon{padding:6px 10px}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 0;border-bottom:1px solid var(--line)}
.filters{display:grid;grid-template-columns:2fr 1.2fr 2fr 1.1fr auto;gap:8px;align-items:end}
.btns{display:flex;gap:8px;flex-wrap:wrap}

.mass{background:var(--blue-bg);border-top:2px solid var(--blue);border-bottom:1px solid var(--line)}
.mass .wrap{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding-top:8px;padding-bottom:8px}
.mass b{font-family:"Barlow Condensed",sans-serif;font-size:1.15rem;color:var(--blue);margin-right:4px}
.mass .sp{margin-left:auto}

.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;margin:16px 0 8px}
.sign{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:8px;padding:10px 14px;min-height:70px;min-width:0}
.sign:hover{border-color:var(--c)}
.sign:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.sign .num{grid-row:1 / span 2;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.1rem;line-height:1;color:var(--c);min-width:2ch}
.sign .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;line-height:1.05;overflow-wrap:anywhere}
.sign .ct{font-size:.85rem;color:var(--muted)}
.sign[aria-current="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.sign[aria-current="true"] .num,.sign[aria-current="true"] .ct{color:#fff}
.signs.dim .sign{opacity:.4}
.signs.dim .sign.hit{opacity:1}
.hint{color:var(--muted);font-size:.95rem;margin:4px 0 12px}

main{padding-top:10px;padding-bottom:60px}
.dept{margin:0 0 36px}
.dhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--c);color:#fff;border-radius:8px;padding:12px 18px;margin-bottom:14px}
.dhead .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.3rem;line-height:1}
.dhead h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.9rem;line-height:1;margin:0}
.dhead .ct{margin-left:auto;opacity:.92}
.group{margin:0 0 20px}
.ghead{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;border-bottom:3px solid var(--c);padding:0 2px 6px;margin:0 0 10px}
.ghead .gc{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--c);font-size:1.25rem}
.ghead h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.4rem;margin:0;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.ghead .gn{margin-left:auto;font-size:.9rem;color:var(--muted);white-space:nowrap}
.subs{columns:380px;column-gap:14px}
.sub{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;margin:0 0 14px;padding:10px 12px 6px}
.shead{display:flex;gap:8px;align-items:center;margin:0 0 4px}
.shead input{width:17px;height:17px;flex-shrink:0;accent-color:var(--blue)}
.shead .sc{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--c)}
.shead h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.12rem;margin:0;line-height:1.1;min-width:0;overflow-wrap:anywhere}
.shead .sn{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.sub ul{list-style:none;margin:0;padding:0}
.sub li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--soft)}
.sub li:first-child{border-top:0}
.sub li input{width:17px;height:17px;margin-top:3px;flex-shrink:0;accent-color:var(--blue)}
.sub li .tx{flex:1;min-width:0}
.sub li.sel{background:var(--blue-bg);margin:0 -12px;padding-left:12px;padding-right:12px}
.sub li.edited .pd::after{content:" ✓ salvo";color:var(--green);font-size:.8rem;font-weight:600}
.pd{font-size:.95rem;font-weight:500;overflow-wrap:anywhere}
.pd.star{color:var(--amber)}
.pm{font-size:.8rem;color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-weight:500;letter-spacing:.02em;display:flex;gap:10px;flex-wrap:wrap}
.tag{display:inline-block;padding:0 6px;border-radius:4px;border:1px solid var(--line);font-size:.75rem}
.tag.ai{color:#A88FDB;border-color:#A88FDB}
.tag.web{color:#4CC2BE;border-color:#4CC2BE}
.tag.banco{color:var(--green);border-color:var(--green)}
.tag.manual{color:var(--amber);border-color:var(--amber)}
.tag.revisado{color:var(--blue);border-color:var(--blue)}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}

/* janela de edição */
dialog{max-height:92vh;overflow:auto;border:1px solid var(--line);border-top:5px solid var(--ink);border-radius:10px;background:var(--surface);color:var(--ink);padding:22px;width:560px;max-width:94vw}
dialog::backdrop{background:rgba(10,14,12,.6)}
dialog h2{font-family:"Barlow Condensed",sans-serif;font-size:1.6rem;margin:0 0 4px;line-height:1.1}
dialog .meta{color:var(--muted);font-size:.9rem;margin:0 0 12px}
dialog label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
dialog .actions{display:flex;gap:8px;margin-top:18px;align-items:center}
dialog .actions .sp{margin-left:auto}
.subinfo{font-size:.85rem;color:var(--muted);margin-top:4px;min-height:1.2em}
.combo{position:relative}
.opts{margin-top:4px;max-height:260px;overflow:auto;background:var(--surface);border:2px solid var(--ink);border-radius:8px}
.opt{display:flex;gap:10px;align-items:baseline;padding:8px 12px;cursor:pointer;border-top:1px solid var(--soft)}
.opt:first-child{border-top:0}
.opt:hover,.opt.on{background:var(--blue-bg)}
.opt .oc{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--blue);min-width:3.2em}
.opt .on1{font-weight:600}
.opt .op{font-size:.8rem;color:var(--muted);margin-left:auto;text-align:right}
.opt.none{cursor:default;color:var(--muted)}
.subinfo.err{color:var(--red)}

.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(90px);background:var(--surface);border:2px solid var(--line);border-radius:8px;padding:10px 18px;font-weight:500;z-index:50;transition:transform .25s;max-width:92vw}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{border-color:var(--green);color:var(--green)}
.toast.err{border-color:var(--red);color:var(--red)}
.loading{padding:60px 0;text-align:center;color:var(--muted)}

@media (max-width:980px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .f:first-child,.btns{grid-column:1 / -1}
  .bar{position:static}
}
@media (max-width:560px){
  .signs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sign .num{font-size:1.6rem}
  .subs{columns:1}
}
</style>
</head>
<body>

<header class="top wrap">
  <div class="grow">
    <h1>Revisão do banco</h1>
    <div class="levels" id="levels">
      <span class="lv"><i id="tP">0</i> produtos</span>
      <span class="lv"><i id="tS">0</i> subgrupos em uso</span>
      <span class="lv warn" title="Produtos ainda no 9999 ou com * na descrição"><i id="tW">0</i> para revisar</span>
    </div>
  </div>
  <div class="src">
    <div class="f"><label for="padraoSel">Padrão</label>
      <select class="field" id="padraoSel"><option value="super">Supermercado</option><option value="acougue">Açougue</option><option value="frutaria">Frutaria</option></select>
    </div>
    <div class="f"><label for="fonteSel">Banco</label>
      <select class="field" id="fonteSel"><option value="ean">Banco geral (códigos de barras)</option></select>
    </div>
    <button class="btn" id="recarregar" type="button" title="Buscar de novo no Firebase">↻ Recarregar</button>
    <button class="btn" id="tema" type="button" aria-label="Alternar tema claro/escuro">☀</button>
  </div>
</header>

<div class="bar">
  <div class="wrap">
    <div class="filters">
      <div class="f"><label for="fDesc">Descrição</label><input class="field" id="fDesc" placeholder="ex.: tampico, recheio vabene" autocomplete="off"></div>
      <div class="f"><label for="fCod">Código / EAN</label><input class="field" id="fCod" inputmode="numeric" autocomplete="off"></div>
      <div class="f"><label for="fSub">Subgrupo</label><select class="field" id="fSub"><option value="">Todos os subgrupos</option></select></div>
      <div class="f"><label for="fFonte">Origem</label>
        <select class="field" id="fFonte">
          <option value="">Todas</option>
          <option value="revisar">Para revisar (9999 ou *)</option>
          <option value="ai">IA</option><option value="web">Internet</option><option value="banco">Banco</option><option value="manual">Manual</option><option value="revisado">Revisado</option>
        </select>
      </div>
      <div class="btns">
        <button class="btn" id="limpar" type="button">Limpar</button>
        <button class="btn" id="all" type="button" aria-pressed="false">Ver tudo</button>
      </div>
    </div>
  </div>
</div>

<div class="mass" id="mass" hidden>
  <div class="wrap">
    <b id="massN">0 selecionados</b>
    <button class="btn" id="mSub" type="button">📁 Mudar subgrupo</button>
    <button class="btn" id="mRep" type="button">🔀 Substituir texto</button>
    <button class="btn del" id="mDel" type="button">🗑 Excluir do banco</button>
    <button class="btn icon sp" id="mClr" type="button">✕ Limpar seleção</button>
  </div>
</div>

<div class="wrap">
  <nav class="signs" id="signs" aria-label="Departamentos"></nav>
  <p class="hint" id="hint"></p>
</div>
<main class="wrap" id="out"><div class="loading">Carregando o banco…</div></main>

<datalist id="subList"></datalist>

<dialog id="dlg">
  <form method="dialog" id="dlgForm">
    <h2 id="dTitle">Editar produto</h2>
    <p class="meta" id="dMeta"></p>
    <div id="dDescBox">
      <label for="dDesc">Descrição</label>
      <input class="field" id="dDesc" autocomplete="off">
    </div>
    <div id="dRepBox" hidden>
      <label for="dFind">Procurar o texto</label>
      <input class="field" id="dFind" autocomplete="off">
      <label for="dRepl">Trocar por</label>
      <input class="field" id="dRepl" autocomplete="off">
    </div>
    <div id="dSubBox">
      <label for="dSub">Subgrupo (digite o código ou qualquer palavra: “ovos”, “massas”, “refri”…)</label>
      <div class="combo">
        <input class="field" id="dSub" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="dSubOpts">
        <div class="opts" id="dSubOpts" role="listbox" hidden></div>
      </div>
      <div class="subinfo" id="dSubInfo"></div>
    </div>
    <div class="actions">
      <button class="btn del" id="dDel" type="button">🗑 Excluir do banco</button>
      <span class="sp"></span>
      <button class="btn" value="cancel" type="submit" formnovalidate>Cancelar</button>
      <button class="btn ok" id="dSave" type="button">✓ Salvar</button>
    </div>
  </form>
</dialog>

<div class="toast" id="toast" role="status"></div>

// ---------- hierarquia (mesma fonte da classificação) ----------
async function carregarHierarquia(){
  const pd=$("padraoSel").value;
  if(pd!=="super"){
    HIER={};
    try{ const x=await fbGet("padroes/"+pd+"/hierarquia"); if(x) HIER=x; }catch(e){}
    if(!HIER["9999"]) HIER["9999"]={subgrupo:"GERAL",idGrupo:999,grupo:"GERAL",idDepto:99,depto:"DESPESAS"};
    return;
  }
  HIER={...BASE_COPIA};
  try{
    const r = await fetch(SISTEMA_URL+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){ const m=(await r.text()).match(/const HIERARCHY_DATA = (\{.*?\});\n/); if(m) HIER = JSON.parse(m[1]); }
  }catch(e){}
  try{
    const x = await fbGet("hierarquia_extra");
    if(x) Object.entries(x).forEach(([k,v])=>{ if(!v) return; if(!HIER[k]) HIER[k]=v; else if(v.editado && v.subgrupo) HIER[k]={...HIER[k],subgrupo:v.subgrupo}; });
  }catch(e){}
  const opts = Object.entries(HIER).sort((a,b)=>a[0]-b[0]).map(([id,h])=>`<option value="${esc(id+" — "+h.subgrupo)}">${esc((h.depto||"")+" › "+(h.grupo||""))}</option>`);
  $("subList").innerHTML = opts.join("");
}
function lerSub(txt){
  const ds = $("dSub").dataset.id;
  if(ds && HIER[ds] && txt===rotuloSub(ds)) return ds;
  const m = String(txt).trim().match(/^(\d+)/);
  if(m && HIER[m[1]]) return m[1];
  const n = norm(txt).trim(); if(!n) return null;
  const hit = Object.entries(HIER).filter(([,h])=>norm(h.subgrupo)===n);
  return hit.length===1 ? hit[0][0] : null;
}
function rotuloSub(id){ const h=HIER[id]; return h ? `${id} — ${h.subgrupo}` : String(id); }

  try{
    const x = await fbGet(pBase()+"banco_empresa","?shallow=true");

    sel.innerHTML = `<option value="ean">Banco geral (códigos de barras)</option>` +

    if([...sel.options].some(o=>o.value===atual)) sel.value=atual;
  }catch(e){}
}

  const val = $("fSub").value;
  $("fSub").innerHTML = `<option value="">Todos os subgrupos</option>` + TREE.map(d=>
    `<optgroup label="${esc(d.c+" — "+nmD(d.n))}">`+d.g.map(g=>g.s.map(s=>`<option value="${esc(s.c)}">${esc(s.c+" — "+s.n)} (${s.p.length})</option>`).join("")).join("")+`</optgroup>`).join("");
  if([...$("fSub").options].some(o=>o.value===val)) $("fSub").value=val;
  if(!TREE.some(d=>d.c===current)) current = TREE[0]?.c;
}

// ---------- tela ----------
function hl(text, words){
  if(!words.length) return esc(text);
  const n = norm(text); const marks=[];
  words.forEach(w=>{let i=n.indexOf(w); while(i>-1){marks.push([i,i+w.length]); i=n.indexOf(w,i+1);}});
  if(!marks.length) return esc(text);
  marks.sort((a,b)=>a[0]-b[0]); let r="",p=0;
  for(const [a,b] of marks){ if(a<p) continue; r+=esc(text.slice(p,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; p=b; }
  return r+esc(text.slice(p));
}
function filtros(){
  const words = norm($("fDesc").value.trim()).split(/\s+/).filter(Boolean);
  const cod = $("fCod").value.replace(/\D/g,"");
  const sub = $("fSub").value, fonte = $("fFonte").value;
  const ativo = !!(words.length||cod||sub||fonte);
  const ok = p => (!sub || p.sub===sub) && (!cod || p.cod.includes(cod) || p.k.includes(cod))
    && (!fonte || (fonte==="revisar" ? revisar(p) : p.fonte===fonte)) && words.every(w=>p.N.includes(w));
  return {words, cod, ativo, ok};
}
function liHTML(p, F){
  const sel = SEL.has(p.k);
  return `<li class="${sel?"sel":""} ${EDITADOS.has(p.k)?"edited":""}" data-k="${esc(p.k)}">
    <input type="checkbox" ${sel?"checked":""} aria-label="Selecionar">
    <div class="tx"><div class="pd ${p.desc.startsWith("*")?"star":""}">${hl(p.desc,F.words)}</div>
    <div class="pm"><span>${$("fonteSel").value==="ean"?"EAN":"Cód."} ${esc(p.cod)}</span><span class="tag ${esc(p.fonte)}">${esc(FONTES[p.fonte]||p.fonte)}</span>${p.at?`<span>${esc(p.at.split("-").reverse().join("/"))}</span>`:""}</div></div>
    <button class="btn icon" type="button" data-edit="${esc(p.k)}" title="Editar">✏</button></li>`;
}
function deptHTML(d, F, only){
  let n=0;
  const groups = d.g.map(g=>{
    let gn=0;
    const subs = g.s.map(s=>{
      const ps = only ? s.p.filter(F.ok) : s.p;
      if(!ps.length) return "";
      n += ps.length; gn += ps.length;
      const todos = ps.every(p=>SEL.has(p.k));
      return `<article class="sub" data-sub="${esc(s.c)}"><div class="shead"><input type="checkbox" data-selsub="${esc(s.c)}" ${todos?"checked":""} aria-label="Selecionar todos do subgrupo"><span class="sc">${esc(s.c)}</span><h4>${esc(s.n)}</h4><span class="sn">${ps.length}</span></div>
        <ul>${ps.map(p=>liHTML(p,F)).join("")}</ul></article>`;
    }).join("");
    if(!subs) return "";
    return `<section class="group"><div class="ghead"><span class="gc">${g.c==="0"?"":esc(g.c)}</span><h3>${esc(g.n)}</h3><span class="gn">${plural(gn,"produto","produtos")}</span></div><div class="subs">${subs}</div></section>`;
  }).join("");
  if(!n) return {html:"",n:0};
  return {n, html:`<section class="dept" style="--c:${COLORS[d.c]||"#6F7874"}">
    <div class="dhead"><span class="num">${d.c==="0"?"?":d.c}</span><h2>${esc(nmD(d.n))}</h2><span class="ct">${plural(n,"produto","produtos")}</span></div>${groups}</section>`};
}
let VISIVEIS = [];
function render(){
  const F = filtros(), signs=$("signs");
  signs.querySelectorAll(".sign").forEach(b=>b.setAttribute("aria-current", String(!F.ativo && !showAll && b.dataset.c===current)));
  let parts=[], total=0;
  if(F.ativo || showAll){
    const hit=new Set();
    TREE.forEach(d=>{ const r=deptHTML(d,F,F.ativo); if(r.n){ total+=r.n; hit.add(d.c); parts.push(r.html);} });
    signs.classList.toggle("dim", F.ativo);
    signs.querySelectorAll(".sign").forEach(b=>b.classList.toggle("hit",hit.has(b.dataset.c)));
  } else {
    signs.classList.remove("dim");
    const d = TREE.find(x=>x.c===current);
    if(d){ const r=deptHTML(d,F,false); total=r.n; parts=[r.html]; }
  }
  if(!PRODS.length){ $("hint").textContent=""; $("out").innerHTML=`<div class="empty">Nenhum produto salvo neste banco.</div>`; return; }
  if(!total){ $("hint").textContent=""; $("out").innerHTML=`<div class="empty">Nenhum produto com esses filtros.</div>`; return; }
  if(total>LIMITE){ $("hint").textContent=""; $("out").innerHTML=`<div class="empty"><b>${plural(total,"produto","produtos")}.</b> São muitos para mostrar de uma vez: use os filtros ou escolha um departamento.</div>`; return; }
  $("hint").textContent = F.ativo ? plural(total,"produto encontrado","produtos encontrados")+"." : (showAll ? "Mostrando todos os departamentos." : "Toque em um departamento, use os filtros ou clique em ✏ para editar um produto.");
  $("out").innerHTML = parts.join("");
}
function atualizarMassa(){ $("mass").hidden = !SEL.size; $("massN").textContent = plural(SEL.size,"selecionado","selecionados"); }
const byK = k => PRODS.find(p=>p.k===k);

// ---------- edição ----------
let editando = null;   // {modo:'um'|'sub'|'rep', ks:[...]}
function abrir(modo, ks){
  editando = {modo, ks};
  const p = modo==="um" ? byK(ks[0]) : null;
  $("dDescBox").hidden = modo!=="um";
  $("dRepBox").hidden = modo!=="rep";
  $("dSubBox").hidden = modo==="rep";
  $("dDel").hidden = modo!=="um";
  $("dSubInfo").textContent=""; $("dSubInfo").className="subinfo";
  if(modo==="um"){
    $("dTitle").textContent = "Editar produto";
    $("dMeta").textContent = `${$("fonteSel").value==="ean"?"EAN":"Código"} ${p.cod} — origem: ${FONTES[p.fonte]||p.fonte}`;
    $("dDesc").value = p.desc.replace(/^\*\s*/,"");
    $("dSub").value = rotuloSub(p.sub); $("dSub").dataset.id = p.sub;
  } else if(modo==="sub"){
    $("dTitle").textContent = "Mudar subgrupo";
    $("dMeta").textContent = plural(ks.length,"produto selecionado","produtos selecionados")+". A descrição não muda.";
    $("dSub").value = ""; delete $("dSub").dataset.id;
  } else {
    $("dTitle").textContent = "Substituir texto na descrição";
    $("dMeta").textContent = plural(ks.length,"produto selecionado","produtos selecionados")+".";
    $("dFind").value=""; $("dRepl").value="";
  }
  fecharOpts(); mostrarSub();
  $("dlg").showModal();
  setTimeout(()=>(modo==="um"?$("dDesc"):modo==="sub"?$("dSub"):$("dFind")).focus(),30);
}
// Busca de subgrupo: aceita código, pedaço do nome, grupo ou departamento, sem acento
function buscarSubs(txt){
  const words = norm(txt).split(/[\s—>›-]+/).filter(Boolean);
  if(!words.length) return [];
  const res=[];
  for(const [id,h] of Object.entries(HIER)){
    const alvo = norm(id+" "+h.subgrupo+" "+(h.grupo||"")+" "+(h.depto||""));
    if(!words.every(w=>alvo.includes(w))) continue;
    const nome = norm(h.subgrupo);
    let peso = 3;
    if(id===words[0]) peso=0;
    else if(words.every(w=>nome.includes(w))) peso = nome.startsWith(words[0]) ? 1 : 2;
    res.push([peso,id,h]);
  }
  return res.sort((a,b)=>a[0]-b[0]||a[1]-b[1]).slice(0,60);
}
let optIdx=-1;
function abrirOpts(){
  const box=$("dSubOpts"), txt=$("dSub").value;
  if(lerSub(txt) && txt===rotuloSub(lerSub(txt))){ fecharOpts(); return; }
  const r=buscarSubs(txt);
  optIdx = r.length ? 0 : -1;
  box.innerHTML = r.length ? r.map(([,id,h],i)=>`<div class="opt ${i===0?"on":""}" role="option" data-id="${esc(id)}"><span class="oc">${esc(id)}</span><span class="on1">${esc(h.subgrupo)}</span><span class="op">${esc(nmD(h.depto||""))} › ${esc(h.grupo||"")}</span></div>`).join("")
    : (txt.trim() ? `<div class="opt none">Nenhum subgrupo com “${esc(txt)}”. Tente outra palavra.</div>` : "");
  box.hidden = !box.innerHTML; $("dSub").setAttribute("aria-expanded",String(!box.hidden));
}
function fecharOpts(){ $("dSubOpts").hidden=true; $("dSub").setAttribute("aria-expanded","false"); }
function escolherSub(id){ $("dSub").dataset.id=id; $("dSub").value=rotuloSub(id); fecharOpts(); mostrarSub(); }
$("dSub").addEventListener("input",()=>{ delete $("dSub").dataset.id; abrirOpts(); });
$("dSub").addEventListener("focus",()=>{ if($("dSub").value && !lerSub($("dSub").value)) abrirOpts(); else $("dSub").select(); });
$("dSub").addEventListener("keydown",e=>{
  const box=$("dSubOpts"); const ops=[...box.querySelectorAll(".opt[data-id]")];
  if(box.hidden || !ops.length) return;
  if(e.key==="ArrowDown"||e.key==="ArrowUp"){ e.preventDefault(); optIdx=(optIdx+(e.key==="ArrowDown"?1:-1)+ops.length)%ops.length; ops.forEach((o,i)=>o.classList.toggle("on",i===optIdx)); ops[optIdx].scrollIntoView({block:"nearest"}); }
  else if(e.key==="Enter"){ e.preventDefault(); e.stopPropagation(); escolherSub(ops[Math.max(optIdx,0)].dataset.id); }
  else if(e.key==="Escape"){ e.preventDefault(); e.stopPropagation(); fecharOpts(); }
});
$("dSubOpts").addEventListener("mousedown",e=>{ const o=e.target.closest(".opt[data-id]"); if(o){ e.preventDefault(); escolherSub(o.dataset.id); } });
$("dSub").addEventListener("blur",()=>setTimeout(fecharOpts,150));

function mostrarSub(){
  if($("dSubBox").hidden) return;
  const id = lerSub($("dSub").value), h = id && HIER[id];
  $("dSubInfo").className = "subinfo"+(($("dSub").value && !h)?" err":"");
  $("dSubInfo").textContent = h ? `✓ ${h.depto} › ${h.grupo} › ${h.subgrupo}` : ($("dSub").value ? "Escolha um subgrupo na lista que aparece ao digitar." : "");
}
$("dSub").addEventListener("input", mostrarSub);
$("dlg").addEventListener("cancel", e=>{ if(!$("dSubOpts").hidden){ e.preventDefault(); fecharOpts(); } });

async function salvar(){
  const {modo, ks} = editando; const hoje = new Date().toISOString().slice(0,10);
  const base = caminho(); const up = {};
  if(modo==="rep"){
    const find = $("dFind").value; if(!find){ toast("Informe o texto a procurar","err"); return; }
    const repl = $("dRepl").value.toUpperCase(); const nf = norm(find);
    ks.forEach(k=>{ const p=byK(k); if(!p) return; const i=norm(p.desc).indexOf(nf); if(i<0) return;
      const nova=(p.desc.slice(0,i)+repl+p.desc.slice(i+find.length)).replace(/\s+/g," ").trim();
      if(nova!==p.desc){ up[k+"/descricao"]=nova; up[k+"/fonte"]="revisado"; up[k+"/atualizado"]=hoje; } });
    if(!Object.keys(up).length){ toast("O texto não foi encontrado nos selecionados","err"); return; }
  } else {
    const sub = lerSub($("dSub").value);
    if(!sub){ toast("Escolha um subgrupo válido da lista","err"); $("dSub").focus(); return; }
    if(modo==="um"){
      const desc = $("dDesc").value.trim().toUpperCase().replace(/^\*\s*/,"").replace(/\s+/g," ");
      if(!desc){ toast("A descrição não pode ficar vazia","err"); return; }
      Object.assign(up,{[ks[0]+"/descricao"]:desc,[ks[0]+"/idNivel1"]:sub,[ks[0]+"/fonte"]:"revisado",[ks[0]+"/atualizado"]:hoje});
    } else ks.forEach(k=>{ Object.assign(up,{[k+"/idNivel1"]:sub,[k+"/fonte"]:"revisado",[k+"/atualizado"]:hoje});
      const p=byK(k); if(p && p.desc.startsWith("*")) up[k+"/descricao"]=p.desc.replace(/^\*\s*/,""); });
  }
  $("dSave").disabled=true;
  try{
    await fbPatch(base, up);
    Object.entries(up).forEach(([path,v])=>{ const [k,campo]=path.split("/"); const p=byK(k); if(!p) return;
      if(campo==="descricao"){ p.desc=v; p.N=norm(v); } if(campo==="idNivel1") p.sub=String(v); if(campo==="fonte") p.fonte=v; if(campo==="atualizado") p.at=v; EDITADOS.add(k); });
    const n = new Set(Object.keys(up).map(x=>x.split("/")[0])).size;
    $("dlg").close(); if(modo!=="um"){ SEL.clear(); atualizarMassa(); }
    montar(); preencher(); render();
    toast(plural(n,"produto salvo","produtos salvos")+" no banco","ok");
  }catch(e){ toast("Não salvou: "+e.message,"err"); }
  finally{ $("dSave").disabled=false; }
}
async function excluir(ks){
  if(!confirm(`Excluir ${plural(ks.length,"produto","produtos")} do banco?\n\nNa próxima importação, ${ks.length===1?"ele volta":"eles voltam"} como pendente${ks.length===1?"":"s"} para corrigir de novo.`)) return;
  const up={}; ks.forEach(k=>up[k]=null);
  try{
    await fbPatch(caminho(), up);
    const set=new Set(ks); PRODS=PRODS.filter(p=>!set.has(p.k)); ks.forEach(k=>SEL.delete(k));
    if($("dlg").open) $("dlg").close(); atualizarMassa(); montar(); preencher(); render();
    toast(plural(ks.length,"produto excluído","produtos excluídos")+" do banco","ok");
  }catch(e){ toast("Não excluiu: "+e.message,"err"); }
}
$("dSave").onclick = salvar;
$("dDel").onclick = ()=>excluir(editando.ks);
$("dlgForm").addEventListener("keydown", e=>{ if(e.key==="Enter" && e.target.tagName==="INPUT" && $("dSubOpts").hidden){ e.preventDefault(); salvar(); } });

// ---------- eventos ----------
$("out").addEventListener("click", e=>{
  const ed = e.target.closest("[data-edit]"); if(ed){ abrir("um",[ed.dataset.edit]); return; }
  const cb = e.target.closest('li input[type="checkbox"]');
  if(cb){ const k=cb.closest("li").dataset.k; cb.checked?SEL.add(k):SEL.delete(k); cb.closest("li").classList.toggle("sel",cb.checked); atualizarMassa(); return; }
  const cs = e.target.closest("[data-selsub]");
  if(cs){ const box=cs.closest(".sub"); box.querySelectorAll("li").forEach(li=>{ const k=li.dataset.k; cs.checked?SEL.add(k):SEL.delete(k); li.classList.toggle("sel",cs.checked); li.querySelector("input").checked=cs.checked; }); atualizarMassa(); }
});
$("signs").addEventListener("click", e=>{
  const b=e.target.closest(".sign"); if(!b) return;
  ["fDesc","fCod"].forEach(id=>$(id).value=""); $("fSub").value=""; $("fFonte").value="";
  showAll=false; $("all").setAttribute("aria-pressed","false"); current=b.dataset.c; render(); $("out").scrollIntoView({block:"start"});
});
let t; ["fDesc","fCod"].forEach(id=>$(id).addEventListener("input",()=>{clearTimeout(t); t=setTimeout(render,180);}));
["fSub","fFonte"].forEach(id=>$(id).addEventListener("change",render));
$("limpar").onclick=()=>{ ["fDesc","fCod"].forEach(id=>$(id).value=""); $("fSub").value=""; $("fFonte").value=""; render(); };
$("all").onclick=()=>{ showAll=!showAll; $("all").setAttribute("aria-pressed",String(showAll)); render(); };
$("mSub").onclick=()=>abrir("sub",[...SEL]);
$("mRep").onclick=()=>abrir("rep",[...SEL]);
$("mDel").onclick=()=>excluir([...SEL]);
$("mClr").onclick=()=>{ SEL.clear(); atualizarMassa(); render(); };
$("fonteSel").addEventListener("change", carregarProdutos);
$("padraoSel").addEventListener("change", async()=>{ $("fonteSel").value="ean"; await carregarHierarquia(); await carregarEmpresas(); carregarProdutos(); });
(async()=>{ try{ const n=await fbGet("padroes_nomes"); if(n){ const s=$("padraoSel"); Object.entries(n).forEach(([k,v])=>{ if(![...s.options].some(o=>o.value===k)) s.insertAdjacentHTML("beforeend",`<option value="${esc(k)}">${esc(v)}</option>`); else [...s.options].find(o=>o.value===k).textContent=v; }); } }catch(e){} })();
$("recarregar").onclick=async()=>{ await carregarHierarquia(); await carregarEmpresas(); carregarProdutos(); };
$("tema").onclick=()=>{ const dark=document.documentElement.getAttribute("data-theme")!=="dark";
  if(dark) document.documentElement.setAttribute("data-theme","dark"); else document.documentElement.removeAttribute("data-theme");
  try{ localStorage.setItem("tema",dark?"dark":"light"); }catch(e){} $("tema").textContent=dark?"☀":"☾"; };
$("tema").textContent = document.documentElement.getAttribute("data-theme")==="dark"?"☀":"☾";

(async()=>{ await carregarHierarquia(); await carregarEmpresas(); await carregarProdutos(); })();
</script>
