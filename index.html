<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Classificação de produtos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#17201D; --muted:#5B6863; --line:#D6DCD8; --soft:#E8ECE9; --mark:#FFE58A;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#141a18; --surface:#1d2522; --ink:#E9EEEB; --muted:#9AA6A1; --line:#33403b; --soft:#26302c; --mark:#7a6416;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141a18; --surface:#1d2522; --ink:#E9EEEB; --muted:#9AA6A1; --line:#33403b; --soft:#26302c; --mark:#7a6416;
  color-scheme:dark;
}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 90px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

header.top{padding-top:36px;padding-bottom:20px}
.top h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1;margin:0 0 12px;letter-spacing:-.01em}
.levels{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:0;color:var(--muted);font-size:1rem}
.levels b{color:var(--ink);font-weight:600}
.lv{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.lv i{font-style:normal;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;color:var(--ink)}
.sep{color:var(--muted)}
.status{margin:10px 0 0;font-size:.85rem;color:var(--muted)}
.status.ok::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#3F8A33;margin-right:6px;vertical-align:middle}

.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{flex:1 1 320px;position:relative}
.search input{width:100%;font:inherit;font-size:1.05rem;padding:12px 40px 12px 14px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.search input:focus{outline:none;border-color:var(--ink)}
.search button{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:1.3rem;cursor:pointer;padding:4px 8px;display:none}
.search.has button{display:block}
.btn{font:inherit;font-weight:600;padding:11px 16px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
:focus-visible{outline:3px solid #2F7FA8;outline-offset:2px}

/* placas de departamento */
.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:22px 0 8px}
.sign{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:8px;padding:12px 14px;min-height:78px}
.sign:hover{border-color:var(--c);border-left-color:var(--c)}
.sign:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.sign .num{grid-row:1 / span 2;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.4rem;line-height:1;color:var(--c);min-width:2ch}
.sign .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;line-height:1.05}
.sign .ct{font-size:.85rem;color:var(--muted)}
.sign[aria-current="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.sign[aria-current="true"] .num,.sign[aria-current="true"] .ct{color:#fff}
.signs.dim .sign{opacity:.45}
.signs.dim .sign.hit{opacity:1}

/* detalhe */
main{padding:18px 0 60px}
.dept{margin:0 0 40px}
.dhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--c);color:#fff;border-radius:8px;padding:14px 18px;margin-bottom:16px}
.dhead .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.6rem;line-height:1}
.dhead h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2rem;line-height:1;margin:0}
.dhead .ct{margin-left:auto;font-size:.95rem;opacity:.92}
.groups{columns:290px;column-gap:14px}
.group{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;margin:0 0 14px;padding:12px 14px 8px}
.ghead{display:flex;gap:10px;align-items:baseline;margin:0 0 6px}
.ghead .gc{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--c);font-size:1.15rem}
.ghead h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.25rem;margin:0;line-height:1.1}
.ghead .gn{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.group ul{list-style:none;margin:0;padding:0}
.group li{display:flex;gap:10px;padding:5px 0;border-top:1px solid var(--soft);font-size:.95rem}
.group li:first-child{border-top:0}
.group li .sc{font-family:"Barlow Condensed",sans-serif;font-weight:600;color:var(--muted);min-width:3.2em}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.path{font-size:.8rem;color:var(--muted);margin:-2px 0 6px}

.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.hint{color:var(--muted);font-size:.95rem;margin:4px 0 14px}
footer{color:var(--muted);font-size:.85rem;padding-top:20px;padding-bottom:40px;border-top:1px solid var(--line)}

@media (max-width:560px){
  .signs{grid-template-columns:1fr 1fr}
  .sign{padding:10px;border-left-width:7px;min-height:70px}
  .sign .num{font-size:1.8rem}
  .sign .nm{font-size:1.05rem}
  .dhead .ct{margin-left:0;width:100%}
  .bar .btn{flex:1}
}
@media print{
  .bar,.signs,.hint,footer .noprint{display:none!important}
  body{background:#fff;color:#000}
  .group{border-color:#bbb}
  .dept{break-before:page}
  .dept:first-child{break-before:auto}
  .dhead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
@media (prefers-reduced-motion:no-preference){
  .sign{transition:background-color .15s,opacity .15s}
}
</style>
</head>

STOS","idGrupo":992,"grupo":"ESCRITORIO","idDepto":99,"depto":"DESPESAS"},"9997":{"subgrupo":"DESPESAS PREDIAL","idGrupo":992,"grupo":"ESCRITORIO","idDepto":99,"depto":"DESPESAS"},"9998":{"subgrupo":"ATIVOS IMOBILIZADOS","idGrupo":992,"grupo":"ESCRITORIO","idDepto":99,"depto":"DESPESAS"},"9999":{"subgrupo":"GERAL","idGrupo":999,"grupo":"GERAL","idDepto":99,"depto":"DESPESAS"}};
const DATA_COPIA = "23/10/2026";

function montar(flat){
  const deps={};
  Object.entries(flat).forEach(([id,v])=>{
    if(v==null||v.idDepto==null||v.idGrupo==null) return;
    const dc=String(v.idDepto), gc=String(v.idGrupo);
    const d = deps[dc] ||= {c:dc,n:(v.depto||"").trim(),g:{}};
    const g = d.g[gc] ||= {c:gc,n:(v.grupo||"").trim(),s:[]};
    g.s.push([String(id),(v.subgrupo||"").trim()]);
  });
  return Object.values(deps).sort((a,b)=>a.c-b.c).map(d=>({...d,g:Object.values(d.g).sort((a,b)=>a.c-b.c).map(g=>({...g,s:g.s.sort((a,b)=>a[0]-b[0])}))}));
}
let DATA = montar(BASE_COPIA);

const COLORS = {"10":"#B9791E","20":"#B23A3A","30":"#3F8A33","40":"#8E5F36","50":"#2A78A3","60":"#6A4BA0","70":"#1F918E","80":"#BC4F87","90":"#4A5894","99":"#6F7874"};
const TITLE = {"MERCEARIA":"Mercearia","ACOUGUE":"Açougue","HORTIFRUTI":"Hortifrúti","FABRICACAO PROPRIA":"Fabricação própria","PERECIVEIS":"Perecíveis","BEBIDAS":"Bebidas","LIMPEZA":"Limpeza","PERFUMARIA":"Perfumaria","BAZAR":"Bazar","DESPESAS":"Despesas"};
const nm = d => TITLE[d.n] || d.n;
const sub = d => d.g.reduce((a,g)=>a+g.s.length,0);
const esc = s => s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
const plural = (n,a,b) => n+" "+(n===1?a:b);


const signs = document.getElementById("signs"), out = document.getElementById("out");
const q = document.getElementById("q"), sbox = document.getElementById("sbox"), allBtn = document.getElementById("all");
let current = null, showAll = false;

function totais(){
  document.getElementById("tD").textContent = DATA.length;
  document.getElementById("tG").textContent = DATA.reduce((a,d)=>a+d.g.length,0);
  document.getElementById("tS").textContent = DATA.reduce((a,d)=>a+sub(d),0);
  signs.innerHTML = DATA.map(d=>`<button class="sign" data-c="${d.c}" style="--c:${COLORS[d.c]||'#6F7874'}">
  <span class="num">${d.c}</span><span class="nm">${esc(nm(d))}</span>
  <span class="ct">${plural(d.g.length,"grupo","grupos")}, ${plural(sub(d),"subgrupo","subgrupos")}</span></button>`).join("");
}

function hl(text, terms){
  let t = esc(text);
  if(!terms.length) return t;
  const n = norm(text); let marks=[];
  terms.forEach(w=>{let i=n.indexOf(w); while(i>-1){marks.push([i,i+w.length]); i=n.indexOf(w,i+1);}});
  if(!marks.length) return t;
  marks.sort((a,b)=>a[0]-b[0]);
  let r="",p=0;
  for(const [a,b] of marks){ if(a<p) continue; r+=esc(text.slice(p,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; p=b; }
  return r+esc(text.slice(p));
}

function deptHTML(d, groups, terms){
  const c = COLORS[d.c]||"#6F7874";
  const ns = groups.reduce((a,g)=>a+g.s.length,0);
  return `<section class="dept" id="d${d.c}" style="--c:${c}">
    <div class="dhead"><span class="num">${d.c}</span><h2>${esc(nm(d))}</h2>
    <span class="ct">${plural(groups.length,"grupo","grupos")}, ${plural(ns,"subgrupo","subgrupos")}</span></div>
    <div class="groups">${groups.map(g=>`<article class="group">
      <div class="ghead"><span class="gc">${g.c}</span><h3>${hl(g.n,terms)}</h3><span class="gn">${g.s.length}</span></div>
      <ul>${g.s.map(s=>`<li><span class="sc">${s[0]}</span><span>${hl(s[1],terms)}</span></li>`).join("")}</ul>
    </article>`).join("")}</div></section>`;
}

function render(){
  const raw = q.value.trim();
  sbox.classList.toggle("has", !!raw);
  const terms = norm(raw).split(/\s+/).filter(Boolean);
  signs.querySelectorAll(".sign").forEach(b=>b.setAttribute("aria-current", String(!terms.length && !showAll && b.dataset.c===current)));
  if(terms.length){
    const match = s => terms.every(w=>norm(s).includes(w));
    let html="", hits=0, hitDeps=new Set();
    DATA.forEach(d=>{
      const gs=[];
      d.g.forEach(g=>{
        const gHit = terms.every(w=>norm(g.n+" "+g.c).includes(w));
        const ss = gHit ? g.s : g.s.filter(s=>match(s[1]+" "+s[0]));
        if(ss.length){ gs.push({...g,s:ss}); hits+=ss.length; }
      });
      if(gs.length){ hitDeps.add(d.c); html+=deptHTML(d,gs,terms); }
    });
    signs.classList.add("dim");
    signs.querySelectorAll(".sign").forEach(b=>b.classList.toggle("hit",hitDeps.has(b.dataset.c)));
    document.getElementById("hint").textContent = hits ? `${plural(hits,"subgrupo encontrado","subgrupos encontrados")} para “${raw}”.` : "";
    out.innerHTML = hits ? html : `<div class="empty">Nada encontrado para <b>“${esc(raw)}”</b>. Tente uma palavra mais curta ou sem acento, como “frango” ou “sabao”.</div>`;
    return;
  }
  signs.classList.remove("dim");
  if(showAll){
    document.getElementById("hint").textContent = "Mostrando todos os departamentos.";
    out.innerHTML = DATA.map(d=>deptHTML(d,d.g,[])).join("");
    return;
  }
  const d = DATA.find(x=>x.c===current);
  document.getElementById("hint").textContent = d ? "" : "Toque em um departamento para ver seus grupos e subgrupos.";
  out.innerHTML = d ? deptHTML(d,d.g,[]) : "";
}

signs.addEventListener("click",e=>{
  const b = e.target.closest(".sign"); if(!b) return;
  q.value=""; showAll=false; allBtn.setAttribute("aria-pressed","false");
  current=b.dataset.c; history.replaceState(null,"","#d"+current); render();
  out.scrollIntoView({block:"start"});
});
let t; q.addEventListener("input",()=>{clearTimeout(t); t=setTimeout(render,120);});
document.getElementById("clr").onclick=()=>{q.value="";render();q.focus();};
allBtn.onclick=()=>{showAll=!showAll; allBtn.setAttribute("aria-pressed",String(showAll)); q.value=""; if(showAll) history.replaceState(null,"","#tudo"); render();};
document.getElementById("prt").onclick=()=>{
  const prev={showAll,v:q.value}; showAll=true; q.value=""; render(); window.print();
  showAll=prev.showAll; q.value=prev.v; render();
};
const h = location.hash.replace("#","");
if(h==="tudo"){showAll=true; allBtn.setAttribute("aria-pressed","true");}
else if(/^d\d+$/.test(h)) current=h.slice(1);
function iniciar(){
  if(!DATA.some(d=>d.c===current)) current=DATA[0]?.c;
  totais(); render();
}
iniciar();

// Padrão escolhido: ?padrao=acougue no link, ou pelo seletor
const PADRAO_URL = new URLSearchParams(location.search).get("padrao");
async function atualizarNicho(p){
  const st=document.getElementById("status");
  let x=null;
  try{ const r=await fetch(FIREBASE_URL.replace(/\/+$/,"")+"/padroes/"+encodeURIComponent(p)+"/hierarquia.json",{cache:"no-store"}); if(r.ok) x=await r.json(); }catch(e){}
  const flat={}; if(x) Object.entries(x).forEach(([k,v])=>{ if(k!=="9999") flat[k]=v; });
  DATA=montar(flat); current=null; iniciar();
  st.className = x ? "status ok" : "status";
  st.textContent = x ? "Padrão "+document.getElementById("padraoSel").selectedOptions[0].textContent+" — atualizado agora." : "Não foi possível carregar este padrão agora.";
}
async function atualizar(){
  const sp=document.getElementById("padraoSel").value;
  if(sp!=="super") return atualizarNicho(sp);
  const st=document.getElementById("status");
  let base=null, extra=null;
  try{
    const r=await fetch(SISTEMA_URL+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){
      const m=(await r.text()).match(/const HIERARCHY_DATA = (\{.*?\});\n/);
      if(m) base=JSON.parse(m[1]);
    }
  }catch(e){}
  if(FIREBASE_URL){
    try{
      const r=await fetch(FIREBASE_URL.replace(/\/+$/,"")+"/hierarquia_extra.json",{cache:"no-store"});
      if(r.ok) extra=await r.json();
    }catch(e){}
  }
  const flat={...(base||BASE_COPIA)};
  let novos=0;
  if(extra) Object.entries(extra).forEach(([id,v])=>{ if(!v) return; if(!flat[id]){flat[id]=v; novos++;} else if(v.editado && v.subgrupo){ flat[id]={...flat[id], subgrupo:v.subgrupo}; } });
  DATA=montar(flat);
  iniciar();
  const agora=new Date().toLocaleString("pt-BR",{dateStyle:"short",timeStyle:"short"});
  if(base && (extra || !FIREBASE_URL)){
    st.className="status ok";
    st.textContent=`Atualizado direto do sistema de cadastro em ${agora}`+(novos?`, com ${novos===1?"1 subgrupo novo":novos+" subgrupos novos"}.`:".");
  }else if(base||extra){
    st.className="status ok";
    st.textContent=`Atualizado em ${agora}`+(novos?`, com ${novos===1?"1 subgrupo novo":novos+" subgrupos novos"}.`:".");
  }else{
    st.className="status";
    st.textContent=`Mostrando a cópia salva em ${DATA_COPIA}. Não foi possível ler o sistema de cadastro agora.`;
  }
}
(async()=>{
  const s=document.getElementById("padraoSel");
  try{ if(FIREBASE_URL){ const r=await fetch(FIREBASE_URL.replace(/\/+$/,"")+"/padroes_nomes.json"); const n=r.ok?await r.json():null; if(n) Object.entries(n).forEach(([k,v])=>{ const o=[...s.options].find(o=>o.value===k); if(o) o.textContent=v; else s.insertAdjacentHTML("beforeend",`<option value="${esc(k)}">${esc(v)}</option>`); }); } }catch(e){}
  if(PADRAO_URL && [...s.options].some(o=>o.value===PADRAO_URL)) s.value=PADRAO_URL;
  s.addEventListener("change",()=>{ const u=new URL(location.href); if(s.value==="super") u.searchParams.delete("padrao"); else u.searchParams.set("padrao",s.value); history.replaceState(null,"",u.pathname+u.search+u.hash); DATA=montar(BASE_COPIA); current=null; iniciar(); atualizar(); });
  atualizar();
})();
</script>
