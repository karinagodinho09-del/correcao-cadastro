<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Consulta de cadastro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F3F5F2; --surface:#FFFFFF; --ink:#17201D; --muted:#5B6863; --line:#D6DCD8; --soft:#E8ECE9; --mark:#FFE58A; --err:#B23A3A;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#141a18;--surface:#1d2522;--ink:#E9EEEB;--muted:#9AA6A1;--line:#33403b;--soft:#26302c;--mark:#7a6416;--err:#E06B6B;color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#141a18;--surface:#1d2522;--ink:#E9EEEB;--muted:#9AA6A1;--line:#33403b;--soft:#26302c;--mark:#7a6416;--err:#E06B6B;color-scheme:dark;}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.45}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1240px;margin:0 auto;padding-left:20px;padding-right:20px}
.cond{font-family:"Barlow Condensed","Arial Narrow",sans-serif}
:focus-visible{outline:3px solid #2F7FA8;outline-offset:2px}
[hidden]{display:none!important}

header.top{padding-top:32px;padding-bottom:18px;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px}
.top h1{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-weight:700;font-size:clamp(2.1rem,5vw,3.4rem);line-height:1;margin:0 0 10px;letter-spacing:-.01em}
.who{margin:0;color:var(--muted)}
.who b{color:var(--ink)}
.levels{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 0;color:var(--muted)}
.lv{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:4px 10px}
.lv i{font-style:normal;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.05rem;color:var(--ink)}
.top .grow{flex:1 1 auto}

/* entrada */
.login{max-width:440px;margin:24px auto 80px;background:var(--surface);border:1px solid var(--line);border-top:6px solid var(--ink);border-radius:10px;padding:26px}
.login h2{font-family:"Barlow Condensed",sans-serif;font-size:1.8rem;margin:0 0 6px;line-height:1.05}
.login p{color:var(--muted);margin:0 0 18px}
.login label{display:block;font-weight:600;font-size:.95rem;margin:12px 0 4px}
.field{width:100%;font:inherit;font-size:1.05rem;padding:11px 12px;border:2px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.field:focus{outline:none;border-color:var(--ink)}
.login .btn{width:100%;margin-top:18px;background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msg{color:var(--err);font-weight:600;margin:12px 0 0;min-height:1.4em}

/* filtros */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;border-bottom:1px solid var(--line)}
.filters{display:grid;grid-template-columns:2fr 1fr 1.2fr 2fr auto;gap:8px;align-items:end}
.f label{display:block;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:.85rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin:0 0 3px}
.f .field{padding:9px 11px;font-size:1rem}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:inherit;font-weight:600;padding:10px 14px;border-radius:8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;white-space:nowrap}
.btn:hover{border-color:var(--ink)}
.btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.link{border-color:transparent;background:none;color:var(--muted);padding:6px 8px}
.btn.link:hover{color:var(--ink)}

.signs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;margin:20px 0 8px}
.sign{all:unset;box-sizing:border-box;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:10px solid var(--c);border-radius:8px;padding:12px 14px;min-height:76px}
.sign:hover{border-color:var(--c)}
.sign:focus-visible{outline:3px solid var(--c);outline-offset:2px}
.sign .num{grid-row:1 / span 2;font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.3rem;line-height:1;color:var(--c);min-width:2ch}
.sign .nm{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.22rem;line-height:1.05;overflow-wrap:anywhere}
.sign .ct{font-size:.85rem;color:var(--muted)}
.sign[aria-current="true"]{background:var(--c);color:#fff;border-color:var(--c)}
.sign[aria-current="true"] .num,.sign[aria-current="true"] .ct{color:#fff}
.sign.zero{opacity:.4;cursor:default}
.signs.dim .sign{opacity:.4}
.signs.dim .sign.hit{opacity:1}
.hint{color:var(--muted);font-size:.95rem;margin:4px 0 14px}

main{padding-top:14px;padding-bottom:60px}
.dept{margin:0 0 40px}
.dhead{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;background:var(--c);color:#fff;border-radius:8px;padding:14px 18px;margin-bottom:14px}
.dhead .num{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2.5rem;line-height:1}
.dhead h2{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:2rem;line-height:1;margin:0}
.dhead .ct{margin-left:auto;opacity:.92}
.group{margin:0 0 22px}
.ghead{display:flex;gap:10px;align-items:baseline;border-bottom:3px solid var(--c);padding:0 2px 6px;margin:0 0 10px}
.ghead .gc{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--c);font-size:1.3rem}
.ghead h3{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.45rem;margin:0;line-height:1.1}
.ghead .gn{margin-left:auto;font-size:.9rem;color:var(--muted);white-space:nowrap}
.subs{columns:300px;column-gap:14px}
.ghead h3,.shead h4{min-width:0;overflow-wrap:anywhere}
.ghead{flex-wrap:wrap}
.sub{break-inside:avoid;background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--c);border-radius:8px;margin:0 0 14px;padding:10px 14px 6px}
.shead{display:flex;gap:8px;align-items:baseline;margin:0 0 4px}
.shead .sc{font-family:"Barlow Condensed",sans-serif;font-weight:700;color:var(--c)}
.shead h4{font-family:"Barlow Condensed",sans-serif;font-weight:700;font-size:1.15rem;margin:0;line-height:1.1}
.shead .sn{margin-left:auto;font-size:.8rem;color:var(--muted);white-space:nowrap}
.sub ul{list-style:none;margin:0;padding:0}
.sub li{padding:6px 0;border-top:1px solid var(--soft)}
.sub li:first-child{border-top:0}
.pd{font-size:.95rem;font-weight:500}
.pm{font-size:.8rem;color:var(--muted);font-family:"Barlow Condensed",sans-serif;font-weight:500;letter-spacing:.02em}
.pm span+span::before{content:"   ";white-space:pre}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:8px;padding:28px;text-align:center;color:var(--muted)}
.empty b{color:var(--ink)}
.status{font-size:.85rem;color:var(--muted)}
footer{color:var(--muted);font-size:.85rem;padding-top:20px;padding-bottom:40px;border-top:1px solid var(--line)}

@media (max-width:900px){
  .filters{grid-template-columns:repeat(2,minmax(0,1fr))}
  .filters .f:first-child,.filters .f.sg{grid-column:1 / -1}
  .btns{grid-column:1 / -1}
  .btns .btn{flex:1}
  .bar{position:static}
}
@media (max-width:560px){
  .signs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .sign{padding:10px;border-left-width:7px;min-height:68px}
  .sign .num{font-size:1.7rem}
  .sign .nm{font-size:1.02rem}
  .dhead .ct{margin-left:0;width:100%}
}
@media print{
  .bar,.signs,.hint,.noprint{display:none!important}
  body{background:#fff;color:#000}
  .dept{break-before:page}
  .dept:first-of-type{break-before:auto}
  .dhead{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>

<header class="top wrap">
  <div class="grow">
    <h1>Cadastro de produtos</h1>
    <p class="who" id="who">Consulta da classificação dos seus produtos por departamento, grupo e subgrupo.</p>
    <p class="levels" id="levels" hidden>
      <span class="lv"><i id="tP">0</i> produtos</span>
      <span class="lv"><i id="tD">0</i> departamentos</span>
      <span class="lv"><i id="tS">0</i> subgrupos em uso</span>
    </p>
  </div>
  <button class="btn link noprint" id="sair" hidden>Trocar de cliente</button>
</header>

<section class="wrap" id="loginBox">
  <form class="login" id="login" autocomplete="on">
    <h2>Acesse o seu cadastro</h2>
    <p>Informe o número do cliente e o código de acesso que você recebeu.</p>
    <label for="lNum">Número do cliente</label>
    <input class="field" id="lNum" inputmode="numeric" placeholder="ex.: 3697" required>
    <label for="lCod">Código de acesso</label>
    <input class="field" id="lCod" placeholder="ex.: K8F2" style="text-transform:uppercase" required>
    <button class="btn" type="submit" id="lBtn">Consultar</button>
    <p class="msg" id="lMsg" role="alert"></p>
  </form>
</section>

<div id="app" hidden>
  <div class="bar">
    <div class="wrap">
      <div class="filters">
        <div class="f"><label for="fDesc">Descrição</label><input class="field" id="fDesc" placeholder="ex.: sabonete, coca 2l" autocomplete="off"></div>
        <div class="f"><label for="fCod">Código interno</label><input class="field" id="fCod" inputmode="numeric" autocomplete="off"></div>
        <div class="f"><label for="fEan">Código de barras</label><input class="field" id="fEan" inputmode="numeric" autocomplete="off"></div>
        <div class="f sg"><label for="fSub">Subgrupo</label><select class="field" id="fSub"><option value="">Todos os subgrupos</option></select></div>
        <div class="btns">
          <button class="btn" id="limpar" type="button">Limpar</button>
          <button class="btn" id="all" type="button" aria-pressed="false">Ver tudo</button>
          <button class="btn" id="prt" type="button">Imprimir</button>
        </div>
      </div>
    </div>
  </div>
  <div class="wrap">
    <nav class="signs" id="signs" aria-label="Departamentos"></nav>
    <p class="hint" id="hint"></p>
  </div>
  <main class="wrap" id="out" aria-live="polite"></main>
</div>

<footer class="wrap">
  <span id="status" class="status"></span><br>
  Classificação padrão de cadastro — TGMAQ
</footer>

STOS","idGrupo":992,"grupo":"ESCRITORIO","idDepto":99,"depto":"DESPESAS"},"9997":{"subgrupo":"DESPESAS PREDIAL","idGrupo":992,"grupo":"ESCRITORIO","idDepto":99,"depto":"DESPESAS"},"9998":{"subgrupo":"ATIVOS IMOBILIZADOS","idGrupo":992,"grupo":"ESCRITORIO","idDepto":99,"depto":"DESPESAS"},"9999":{"subgrupo":"GERAL","idGrupo":999,"grupo":"GERAL","idDepto":99,"depto":"DESPESAS"}};
const LIMITE = 2500; // máximo de produtos mostrados de uma vez

const COLORS = {"10":"#B9791E","20":"#B23A3A","30":"#3F8A33","40":"#8E5F36","50":"#2A78A3","60":"#6A4BA0","70":"#1F918E","80":"#BC4F87","90":"#4A5894","99":"#6F7874","0":"#6F7874"};
const TITLE = {"MERCEARIA":"Mercearia","ACOUGUE":"Açougue","HORTIFRUTI":"Hortifrúti","FABRICACAO PROPRIA":"Fabricação própria","PERECIVEIS":"Perecíveis","BEBIDAS":"Bebidas","LIMPEZA":"Limpeza","PERFUMARIA":"Perfumaria","BAZAR":"Bazar","DESPESAS":"Despesas","SEM CLASSIFICAÇÃO":"Sem classificação"};
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const norm = s => String(s).normalize("NFD").replace(/[\u0300-\u036f]/g,"").toUpperCase();
const plural = (n,a,b) => n.toLocaleString("pt-BR")+" "+(n===1?a:b);
const nmD = n => TITLE[n] || n;
const $ = id => document.getElementById(id);

let HIER = {...BASE_COPIA};
let PRODS = [];      // {id, ean, desc, sub, N (desc normalizada)}
let TREE = [];       // departamentos com produtos
let cliente = null, current = null, showAll = false;

async function carregarHierarquia(){
  try{
    const r = await fetch(SISTEMA_URL+"?t="+Date.now(),{cache:"no-store"});
    if(r.ok){ const m=(await r.text()).match(/const HIERARCHY_DATA = (\{.*?\});\n/); if(m) HIER = JSON.parse(m[1]); }
  }catch(e){}
  if(FIREBASE_URL){
    try{
      const r = await fetch(FIREBASE_URL.replace(/\/+$/,"")+"/hierarquia_extra.json",{cache:"no-store"});
      if(r.ok){ const x=await r.json(); if(x) Object.entries(x).forEach(([k,v])=>{ if(!v) return; if(!HIER[k]) HIER[k]=v; else if(v.editado && v.subgrupo) HIER[k]={...HIER[k], subgrupo:v.subgrupo}; }); }
    }catch(e){}
  }
}
const hierPronta = carregarHierarquia();

function montar(){
  const deps={};
  PRODS.forEach(p=>{
    const h = HIER[p.sub];
    const dc = h ? String(h.idDepto) : "0", gc = h ? String(h.idGrupo) : "0";
    const d = deps[dc] ||= {c:dc, n: h ? h.depto : "SEM CLASSIFICAÇÃO", g:{}, total:0};
    const g = d.g[gc] ||= {c:gc, n: h ? h.grupo : "SUBGRUPO NÃO ENCONTRADO", s:{}, total:0};
    const s = g.s[p.sub] ||= {c:p.sub, n: h ? h.subgrupo : "Subgrupo "+p.sub, p:[]};
    s.p.push(p); g.total++; d.total++;
  });
  TREE = Object.values(deps).sort((a,b)=>(a.c==="0")-(b.c==="0")||a.c-b.c).map(d=>({...d,
    g:Object.values(d.g).sort((a,b)=>a.c-b.c).map(g=>({...g,
      s:Object.values(g.s).sort((a,b)=>a.c-b.c).map(s=>({...s,p:s.p.sort((a,b)=>a.desc.localeCompare(b.desc,"pt-BR"))}))}))}));
}

function preencherTela(){
  $("tP").textContent = PRODS.length.toLocaleString("pt-BR");
  $("tD").textContent = TREE.filter(d=>d.c!=="0").length;
  $("tS").textContent = TREE.reduce((a,d)=>a+d.g.reduce((b,g)=>b+g.s.length,0),0);
  $("signs").innerHTML = TREE.map(d=>`<button class="sign" data-c="${d.c}" style="--c:${COLORS[d.c]||'#6F7874'}">
    <span class="num">${d.c==="0"?"?":d.c}</span><span class="nm">${esc(nmD(d.n))}</span>
    <span class="ct">${plural(d.total,"produto","produtos")}</span></button>`).join("");
  const opts = [];
  TREE.forEach(d=>{
    opts.push(`<optgroup label="${esc(d.c+" — "+nmD(d.n))}">`);
    d.g.forEach(g=>g.s.forEach(s=>opts.push(`<option value="${esc(s.c)}">${esc(s.c+" — "+s.n)} (${s.p.length})</option>`)));
    opts.push(`</optgroup>`);
  });
  $("fSub").innerHTML = `<option value="">Todos os subgrupos</option>`+opts.join("");
  if(!TREE.some(d=>d.c===current)) current = TREE[0]?.c;
}

function hl(text, term){
  if(!term) return esc(text);
  const words = term.split(/\s+/).filter(Boolean); const n = norm(text); const marks=[];
  words.forEach(w=>{let i=n.indexOf(w); while(i>-1){marks.push([i,i+w.length]); i=n.indexOf(w,i+1);}});
  if(!marks.length) return esc(text);
  marks.sort((a,b)=>a[0]-b[0]); let r="",p=0;
  for(const [a,b] of marks){ if(a<p) continue; r+=esc(text.slice(p,a))+"<mark>"+esc(text.slice(a,b))+"</mark>"; p=b; }
  return r+esc(text.slice(p));
}
function hlCode(code, term){
  if(!term || !code.includes(term)) return esc(code);
  const i=code.indexOf(term); return esc(code.slice(0,i))+"<mark>"+esc(term)+"</mark>"+esc(code.slice(i+term.length));
}

function deptHTML(d, F, onlyMatch){
  const c = COLORS[d.c]||"#6F7874";
  let n=0;
  const groups = d.g.map(g=>{
    const subs = g.s.map(s=>{
      const ps = onlyMatch ? s.p.filter(F.ok) : s.p;
      if(!ps.length) return "";
      n += ps.length;
      return `<article class="sub"><div class="shead"><span class="sc">${esc(s.c)}</span><h4>${esc(s.n)}</h4><span class="sn">${ps.length}</span></div>
        <ul>${ps.map(p=>`<li><div class="pd">${hl(p.desc,F.desc)}</div><div class="pm"><span>Cód. ${hlCode(p.id,F.cod)}</span>${p.ean?`<span>EAN ${hlCode(p.ean,F.ean)}</span>`:""}</div></li>`).join("")}</ul></article>`;
    }).join("");
    if(!subs) return "";
    const tot = onlyMatch ? g.s.reduce((a,s)=>a+s.p.filter(F.ok).length,0) : g.total;
    return `<section class="group"><div class="ghead"><span class="gc">${g.c==="0"?"":esc(g.c)}</span><h3>${esc(g.n)}</h3><span class="gn">${plural(tot,"produto","produtos")}</span></div><div class="subs">${subs}</div></section>`;
  }).join("");
  if(!n) return {html:"",n:0};
  return {n, html:`<section class="dept" id="d${d.c}" style="--c:${c}">
    <div class="dhead"><span class="num">${d.c==="0"?"?":d.c}</span><h2>${esc(nmD(d.n))}</h2><span class="ct">${plural(n,"produto","produtos")}</span></div>${groups}</section>`};
}

function filtros(){
  const desc = norm($("fDesc").value.trim());
  const cod = $("fCod").value.replace(/\D/g,"");
  const ean = $("fEan").value.replace(/\D/g,"");
  const sub = $("fSub").value;
  const words = desc.split(/\s+/).filter(Boolean);
  const ativo = !!(words.length||cod||ean||sub);
  const ok = p => (!sub || p.sub===sub) && (!cod || p.id.includes(cod)) && (!ean || p.ean.includes(ean)) && words.every(w=>p.N.includes(w));
  return {desc, cod, ean, sub, ativo, ok};
}

function render(){
  const F = filtros();
  const signs = $("signs");
  signs.querySelectorAll(".sign").forEach(b=>b.setAttribute("aria-current", String(!F.ativo && !showAll && b.dataset.c===current)));
  if(F.ativo){
    let total = 0; const hit = new Set(); const parts=[];
    TREE.forEach(d=>{ const r = deptHTML(d,F,true); if(r.n){ total+=r.n; hit.add(d.c); parts.push(r.html);} });
    signs.classList.add("dim");
    signs.querySelectorAll(".sign").forEach(b=>b.classList.toggle("hit",hit.has(b.dataset.c)));
    if(!total){ $("hint").textContent=""; $("out").innerHTML=`<div class="empty">Nenhum produto encontrado com esses filtros. <b>Confira o código</b> ou tente uma palavra mais curta, sem acento.</div>`; return; }
    if(total>LIMITE){ $("hint").textContent=""; $("out").innerHTML=`<div class="empty"><b>${plural(total,"produto encontrado","produtos encontrados")}.</b> São muitos para mostrar de uma vez: refine a busca ou escolha um subgrupo.</div>`; return; }
    $("hint").textContent = plural(total,"produto encontrado","produtos encontrados")+".";
    $("out").innerHTML = parts.join("");
    return;
  }
  signs.classList.remove("dim");
  if(showAll){
    $("hint").textContent = "Mostrando todos os departamentos.";
    $("out").innerHTML = TREE.map(d=>deptHTML(d,F,false).html).join("");
    return;
  }
  const d = TREE.find(x=>x.c===current);
  $("hint").textContent = "Toque em um departamento para ver os produtos, ou use os filtros acima.";
  $("out").innerHTML = d ? deptHTML(d,F,false).html : "";
}

async function entrar(num, cod){
  num = String(num).replace(/\D/g,""); cod = String(cod).toUpperCase().replace(/[^A-Z0-9]/g,"");
  $("lMsg").textContent = "";
  if(!num || cod.length<4){ $("lMsg").textContent = "Preencha o número do cliente e o código de acesso."; return; }
  if(!FIREBASE_URL){ $("lMsg").textContent = "A consulta ainda não foi configurada. Fale com a TGMAQ."; return; }
  $("lBtn").disabled = true; $("lBtn").textContent = "Carregando…";
  let dados = null;
  try{
    const r = await fetch(FIREBASE_URL.replace(/\/+$/,"")+"/cadastro_cliente/"+encodeURIComponent(num+"-"+cod)+".json",{cache:"no-store"});
    if(r.ok) dados = await r.json();
  }catch(e){}
  $("lBtn").disabled = false; $("lBtn").textContent = "Consultar";
  if(!dados || !dados.produtos){ $("lMsg").textContent = "Número ou código de acesso incorretos."; return; }
  await hierPronta;
  if(dados.padrao && dados.padrao!=="super"){
    try{
      const r = await fetch(FIREBASE_URL.replace(/\/+$/,"")+"/padroes/"+encodeURIComponent(dados.padrao)+"/hierarquia.json",{cache:"no-store"});
      const x = r.ok ? await r.json() : null;
      if(x) HIER = x;
    }catch(e){}
  }
  const lista = Array.isArray(dados.produtos) ? dados.produtos : Object.values(dados.produtos);
  PRODS = lista.filter(Boolean).map(a=>({id:String(a[0]||""), ean:String(a[1]||""), desc:String(a[2]||""), sub:String(a[3]||"9999")})).map(p=>({...p, N:norm(p.desc)}));
  cliente = {num, cod};
  try{ localStorage.setItem("consulta_cliente", num+"-"+cod); }catch(e){}
  history.replaceState(null,"","#"+num+"-"+cod);
  montar(); preencherTela();
  const dt = dados.atualizado ? dados.atualizado.split("-").reverse().join("/") : "";
  $("who").innerHTML = `Cliente <b>${esc(num)}</b>`+(dt?`, cadastro atualizado em <b>${dt}</b>`:"")+".";
  $("levels").hidden = false; $("sair").hidden = false;
  $("loginBox").hidden = true; $("app").hidden = false;
  render();
}

$("login").addEventListener("submit", e=>{ e.preventDefault(); entrar($("lNum").value, $("lCod").value); });
$("sair").onclick = ()=>{
  try{ localStorage.removeItem("consulta_cliente"); }catch(e){}
  history.replaceState(null,"",location.pathname);
  PRODS=[]; TREE=[]; cliente=null;
  $("app").hidden = true; $("loginBox").hidden = false; $("levels").hidden = true; $("sair").hidden = true;
  $("who").textContent = "Consulta da classificação dos seus produtos por departamento, grupo e subgrupo.";
  $("lNum").value=""; $("lCod").value=""; $("lNum").focus();
};
$("signs").addEventListener("click", e=>{
  const b = e.target.closest(".sign"); if(!b) return;
  limparCampos(); showAll=false; $("all").setAttribute("aria-pressed","false");
  current = b.dataset.c; render(); $("out").scrollIntoView({block:"start"});
});
function limparCampos(){ $("fDesc").value=""; $("fCod").value=""; $("fEan").value=""; $("fSub").value=""; }
let t; ["fDesc","fCod","fEan"].forEach(id=>$(id).addEventListener("input",()=>{clearTimeout(t); t=setTimeout(render,150);}));
$("fSub").addEventListener("change", render);
$("limpar").onclick = ()=>{ limparCampos(); render(); };
$("all").onclick = ()=>{ showAll=!showAll; $("all").setAttribute("aria-pressed",String(showAll)); limparCampos(); render(); };
$("prt").onclick = ()=>window.print();
